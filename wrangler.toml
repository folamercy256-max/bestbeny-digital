# Cloudflare Pages configuration for BestBeny Digital
# -----------------------------------------------------
# Run via: npx wrangler pages deploy .vercel/output/static --project-name bestbeny-digital
# Or wire it up via the Cloudflare dashboard by connecting this GitHub repo.
#
# Build command:        npx @cloudflare/next-on-pages
# Build output directory: .vercel/output/static
# Root directory:        /  (repo root)
# Environment variables: NEXT_TELEMETRY_DISABLED=1

name = "bestbeny-digital"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# No environment variables required for this site to render.
# Prisma is configured but unused in any client-facing component.
